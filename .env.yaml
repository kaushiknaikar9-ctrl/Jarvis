# Environment variables for Cloud Run deployment
# Copy this file and update with your values

# Model configuration
MODEL_CACHE_DIR: "/app/models"
CLOUD_DEPLOYMENT: "true"
ARETE_AVAILABLE: "true"

# Google Cloud configuration
GOOGLE_CLOUD_PROJECT: "gen-lang-client-0998294743"

# TTS configuration
GOOGLE_APPLICATION_CREDENTIALS: "/app/credentials.json"

# Port (Cloud Run expects 8080)
PORT: "8080"

# Python
PYTHONUNBUFFERED: "1"
PYTHONDONTWRITEBYTECODE: "1"